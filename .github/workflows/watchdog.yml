name: Publish watchdog

on:
  schedule:
    - cron: '3-58/5 4-13 * * 6,0,1,2,3,4'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: publish-watchdog
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools
      - name: Start publishing if idle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GHEYMAT_HOURS: ${{ vars.GHEYMAT_HOURS || 'on' }}
        run: python3 tools/watchdog.py
