name: Publish

on:
  workflow_dispatch:
    inputs:
      history:
        description: 'Backfill 40 archive days instead of 12 in this run'
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - 'tools/**'
      - 'requirements.txt'
      - '.github/workflows/gheymat-latest.yml'
      - '.github/actions/**'

concurrency:
  group: gheymat-static
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  gate:
    name: Window
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      open: ${{ steps.window.outputs.open }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools
      - id: window
        env:
          GHEYMAT_HOURS: ${{ vars.GHEYMAT_HOURS || 'on' }}
        run: python3 tools/window.py

  idle:
    name: Idle
    needs: gate
    if: needs.gate.outputs.open == 'false'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools
      - name: Wait for the window and start the next run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/idle.py

  publish:
    name: Publish
    needs: gate
    if: needs.gate.outputs.open == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python and dependencies
        uses: ./.github/actions/setup-python-deps

      - name: Restore feed state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dist
            .feed-state
          key: feed-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: feed-state-

      - name: Restore package downloads
        id: packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/publish_loop.py') }}
          restore-keys: packages-${{ runner.os }}-${{ runner.arch }}-

      - name: Run loop
        id: publish
        timeout-minutes: 4
        run: |
          mkdir -p .feed-state
          python tools/publish_loop.py
        env:
          GHEYMAT_PAYLOAD_KEY: ${{ secrets.GHEYMAT_PAYLOAD_KEY }}
          GHEYMAT_SIGNING_KEY: ${{ secrets.GHEYMAT_SIGNING_KEY }}
          GHEYMAT_PLAIN: "0"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GHEYMAT_AI_SOURCES: ${{ secrets.GHEYMAT_AI_SOURCES }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FEED_STORE_KEY_ID: ${{ secrets.FEED_STORE_KEY_ID }}
          FEED_STORE_SECRET: ${{ secrets.FEED_STORE_SECRET }}
          FEED_STORE_BUCKET: ${{ secrets.FEED_STORE_BUCKET }}
          GHEYMAT_STORE: ${{ vars.GHEYMAT_STORE || 'off' }}
          GHEYMAT_PAGES: ${{ vars.GHEYMAT_PAGES || 'every' }}
          FEED_STORE_V2: ${{ vars.FEED_STORE_V2 || '1' }}
          BACKFILL: ${{ inputs.history && '40' || '12' }}
          GHEYMAT_ORDER: ${{ vars.GHEYMAT_ORDER || 'default' }}
          GHEYMAT_LIVE_FIRST_FROM: ${{ vars.GHEYMAT_LIVE_FIRST_FROM || '' }}
          FLOOR_SECONDS: ${{ vars.GHEYMAT_FLOOR_SECONDS || '90' }}
          GHEYMAT_HOURS: ${{ vars.GHEYMAT_HOURS || 'on' }}
          GHEYMAT_CADENCE_TIERS: ${{ vars.GHEYMAT_CADENCE_TIERS || 'on' }}
          GHEYMAT_SIGNAL_SHADOW: ${{ vars.GHEYMAT_SIGNAL_SHADOW }}
          GHEYMAT_LIVE_STATE: .feed-state/live-guard.json
          GHEYMAT_STATE_DIR: .feed-state
          PUBLISH_LOOP_MINUTES: "3"
          PUBLISH_HARD_SECONDS: "230"

      - name: Tidy feed state
        if: always() && github.ref == 'refs/heads/master'
        run: rm -rf dist/.git

      - name: Save feed state
        if: always() && github.ref == 'refs/heads/master'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dist
            .feed-state
          key: feed-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save package downloads
        if: always() && github.ref == 'refs/heads/master' && steps.packages.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/publish_loop.py') }}

      - name: Drop old feed state
        if: always() && github.ref == 'refs/heads/master'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh cache list --key feed-state- --sort created_at --order desc --limit 100 --json id --jq '.[3:][].id' | xargs -r -n1 gh cache delete
