name: Publish rates

on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:
    inputs:
      history:
        description: 'Backfill 40 archive days instead of 12 in this run'
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - 'tools/**'
      - 'requirements.txt'
      - '.github/workflows/gheymat-latest.yml'
      - '.github/workflows/publish.yml'
      - '.github/actions/**'

concurrency:
  group: gheymat-static
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  publish:
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/publish.yml
    with:
      backfill: ${{ github.event.inputs.history == 'true' }}
    secrets:
      GHEYMAT_PAYLOAD_KEY: ${{ secrets.GHEYMAT_PAYLOAD_KEY }}
      GHEYMAT_SIGNING_KEY: ${{ secrets.GHEYMAT_SIGNING_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GHEYMAT_AI_SOURCES: ${{ secrets.GHEYMAT_AI_SOURCES }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FEED_STORE_KEY_ID: ${{ secrets.FEED_STORE_KEY_ID }}
      FEED_STORE_SECRET: ${{ secrets.FEED_STORE_SECRET }}
      FEED_STORE_BUCKET: ${{ secrets.FEED_STORE_BUCKET }}
