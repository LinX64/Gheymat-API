name: Publish rates

on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:
    inputs:
      history:
        description: 'Backfill 40 archive days instead of 12 in this run'
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - 'tools/**'
      - 'requirements.txt'
      - '.github/workflows/gheymat-latest.yml'

# A push to master pre-empts the running loop, so a fix goes live in minutes instead of after the loop's 5.5 h;
# scheduled and manual runs still queue behind each other.
concurrency:
  group: gheymat-static
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write
    steps:
      - name: Mark start
        run: echo "RUN_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          ref: gh-pages
          path: dist
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -q -r requirements.txt

      - name: Install Wrangler
        id: wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare deploy is off: repository secrets are missing"
            exit 0
          fi
          installed=0
          for attempt in 1 2 3; do
            if timeout -k 15 300 env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID npm install --global --loglevel=error wrangler@4.159.0; then
              installed=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          if [ "$installed" = "1" ]; then
            timeout -k 15 120 env WRANGLER_SEND_METRICS=false wrangler pages project create gheymat-feed --production-branch master >/dev/null 2>&1 || true
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::error::Cloudflare deploy is off: Wrangler install failed 3 times"
          fi

      - name: Mask keys
        env:
          GHEYMAT_PAYLOAD_KEY: ${{ secrets.GHEYMAT_PAYLOAD_KEY }}
          GHEYMAT_SIGNING_KEY: ${{ secrets.GHEYMAT_SIGNING_KEY }}
        run: |
          if [ -z "$GHEYMAT_PAYLOAD_KEY" ] || [ -z "$GHEYMAT_SIGNING_KEY" ]; then
            echo "GHEYMAT_PAYLOAD_KEY / GHEYMAT_SIGNING_KEY secrets are not set" >&2
            exit 1
          fi
          echo "::add-mask::$GHEYMAT_PAYLOAD_KEY"
          echo "::add-mask::$GHEYMAT_SIGNING_KEY"

      - name: Publish
        env:
          GHEYMAT_PAYLOAD_KEY: ${{ secrets.GHEYMAT_PAYLOAD_KEY }}
          GHEYMAT_SIGNING_KEY: ${{ secrets.GHEYMAT_SIGNING_KEY }}
          GHEYMAT_PLAIN: "0"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GHEYMAT_AI_SOURCES: ${{ secrets.GHEYMAT_AI_SOURCES }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MIRROR: ${{ steps.wrangler.outputs.enabled }}
          EXTRA: ${{ github.event.inputs.history == 'true' && '--backfill 40' || '--backfill 12' }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 330*60 ))
          iteration=0
          failures=0
          cf_failures=0
          gh_failures=0
          nothing=0
          red=0
          last_mark=""
          last_publish=0
          last_gh=0
          seeded=0
          have_dist=0
          want_fetch=1
          clean=0
          fast_retry=1
          grace=0
          force=0
          last_slow=0
          slow_after=0
          fresh_restore=1
          force_slow=0
          push_pages() {
            ( cd dist \
              && git init -q \
              && git checkout -q -b gh-pages \
              && git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com add -A \
              && git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -q -m "$1" \
              && timeout -k 10 120 git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages )
          }
          while [ "$(date +%s)" -lt "$deadline" ]; do
            mark=$(python tools/gheymat_snapshot.py --mark 2>/dev/null) || mark=""
            now=$(date +%s)
            since=$(( now - last_publish ))
            due=0
            if [ "$since" -ge 180 ]; then
              due=1
            elif [ "$since" -ge 45 ] && { [ "$force" = "1" ] || { [ -n "$mark" ] && [ "$mark" != "$last_mark" ]; }; }; then
              due=1
            fi
            # Without the Cloudflare channel a build can only go to GitHub Pages, so wait until that push is allowed.
            if [ "$due" = "1" ] && [ "${MIRROR:-}" != "true" ] && [ $(( now - last_gh )) -lt 400 ]; then due=0; fi
            if [ "$due" = "0" ]; then
              sleep 15
              continue
            fi
            iteration=$((iteration + 1))
            force=0
            cf_ok=0
            gh_ok=0
            gh_skip=0
            failures_before=$failures
            nothing_before=$nothing
            # The last verified build is the newest state, so it is kept between iterations. GitHub Pages is re-read
            # at the start, after a bad build, or when its push keeps failing; the copy is swapped in only when the
            # read worked, so a GitHub outage never empties the state the Cloudflare channel builds from.
            if [ "$want_fetch" = "1" ]; then
              rm -rf restore && mkdir -p restore
              if timeout -k 10 120 git fetch -q --depth 1 origin gh-pages 2>/dev/null && git --work-tree=restore checkout -q FETCH_HEAD -- .; then
                git reset -q
                rm -rf dist && mv restore dist
                have_dist=1
                fresh_restore=1
                want_fetch=0
                if [ "$seeded" = "0" ]; then
                  last_gh=$(git log -1 --format=%ct FETCH_HEAD 2>/dev/null) || last_gh=0
                  seeded=1
                fi
              else
                git reset -q 2>/dev/null || true
              fi
              rm -rf restore
            fi
            rc=0
            slow=0
            clean=0
            if [ "$have_dist" = "1" ]; then
              find dist -mindepth 1 -maxdepth 1 ! -name v1 ! -name d ! -name archive -exec rm -rf {} +
              touch dist/.nojekyll
              # Two lanes. Every build refreshes the prices, intraday points and health (what the apps need first). The
              # history, forecast and brief documents are rebuilt only when due: after a fresh restore, after a news
              # refresh, and at least every 30 min (the clients accept a document for 2 h).
              slow=0
              if [ "$now" -ge "$slow_after" ] && { [ "$fresh_restore" = "1" ] || [ "$force_slow" = "1" ] || [ $(( now - last_slow )) -ge 1800 ]; }; then slow=1; fi
              if [ "$slow" = "1" ]; then
                python tools/gheymat_snapshot.py --out dist --history --ai --defer-news $EXTRA --pace 3 || rc=$?
                # A failing slow lane must not hold the prices back: exit 2 (too few rates) and 3 (archive shrank)
                # stop before anything is written, so only other failures fall back to a prices-only build.
                if [ "$rc" != "0" ] && [ "$rc" != "2" ] && [ "$rc" != "3" ]; then
                  echo "::warning::#$iteration slow lane failed (code $rc), publishing prices only"
                  rc=0
                  slow=0
                  slow_after=$(( now + 600 ))
                  python tools/gheymat_snapshot.py --out dist || rc=$?
                fi
              else
                python tools/gheymat_snapshot.py --out dist || rc=$?
              fi
              if [ "$rc" = "0" ]; then python tools/verify_sealed.py dist || rc=90; fi
            else
              rc=91
            fi
            t_build=$(( $(date +%s) - now ))
            if [ "$rc" = "0" ]; then
              clean=1
              if [ "$slow" = "1" ]; then
                last_slow=$now
                fresh_restore=0
                force_slow=0
              fi
              if [ "${MIRROR:-}" = "true" ]; then
                rm -rf site
                if env -u GH_TOKEN -u ANTHROPIC_API_KEY -u GHEYMAT_AI_SOURCES python tools/assemble_site.py --src dist --out site 2>mirror.log \
                  && env -u GH_TOKEN -u ANTHROPIC_API_KEY -u GHEYMAT_AI_SOURCES -u GHEYMAT_SIGNING_KEY python tools/verify_sealed.py --site site 2>>mirror.log \
                  && env -u GH_TOKEN -u GHEYMAT_PAYLOAD_KEY -u GHEYMAT_SIGNING_KEY -u ANTHROPIC_API_KEY -u GHEYMAT_AI_SOURCES WRANGLER_SEND_METRICS=false timeout -k 15 300 wrangler pages deploy site --project-name gheymat-feed --branch master >/dev/null 2>>mirror.log; then
                  cf_failures=0
                  cf_ok=1
                  echo "#$iteration cloudflare $(date -u +%H:%M:%SZ) (build ${t_build}s, live $(( $(date +%s) - now ))s after detection)"
                else
                  cf_failures=$((cf_failures + 1))
                  echo "::warning::#$iteration Cloudflare deploy failed ($cf_failures in a row)"
                  tail -n 8 mirror.log | sed -e 's/##\[/## [/g' -e 's/^/| /' || true
                fi
                rm -rf site
              elif [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
                cf_failures=$((cf_failures + 1))
                echo "::warning::#$iteration Cloudflare deploy unavailable ($cf_failures in a row)"
              fi
              # Cloudflare (what the apps read) gets every build. The legacy GitHub Pages copy is always throttled,
              # within a run and across runs, to stay under its 10 builds an hour.
              if [ $(( now - last_gh )) -lt 400 ]; then
                gh_skip=1
                echo "#$iteration github push skipped (throttle)"
              elif push_pages "Publish $iteration"; then
                failures=0
                gh_failures=0
                gh_ok=1
                last_gh=$now
                echo "#$iteration published $(date -u +%H:%M:%SZ)"
              else
                failures=$((failures + 1))
                gh_failures=$((gh_failures + 1))
                last_gh=0
                # Keep the newer local state for one retry; a second failure in a row re-reads the published copy,
                # so a file the host rejects cannot repeat forever.
                if [ "$gh_failures" -eq 2 ]; then want_fetch=1; fi
                echo "#$iteration GitHub push failed ($failures in a row)" >&2
              fi
              rm -rf dist/.git
            else
              failures=$((failures + 1))
              # Exit 2 means too few rates and nothing written, so the state is still good; anything else is not.
              if [ "$rc" != "2" ]; then
                have_dist=0
                want_fetch=1
              fi
              echo "#$iteration failed (code $rc, $failures in a row)" >&2
            fi
            published=0
            if [ "$cf_ok" = "1" ] || [ "$gh_ok" = "1" ]; then published=1; fi
            if [ "$published" = "1" ]; then
              nothing=0
            elif [ "$rc" != "0" ] || [ "$gh_skip" = "0" ]; then
              nothing=$((nothing + 1))
            fi
            # One quick retry (about 45 s) after the first unpublished iteration, then back to the 6-minute spacing.
            # The quick retry itself does not count towards the 5-in-a-row limits, so they are reached no sooner.
            if [ "$published" = "1" ]; then
              last_mark=$mark
              fast_retry=1
              grace=0
            else
              if [ "$grace" = "1" ]; then
                failures=$failures_before
                nothing=$nothing_before
              fi
              last_mark=$mark
              if [ "$fast_retry" = "1" ]; then
                force=1
                fast_retry=0
                grace=1
              else
                grace=0
              fi
            fi
            last_publish=$now
            # News is refreshed after prices are out, never inside the price build; a refresh ships on the next build.
            if [ "$rc" = "0" ]; then
              news_rc=0
              news=$(timeout -k 10 150 python tools/gheymat_snapshot.py --out dist --news-only 2>/dev/null) || news_rc=$?
              if [ "$news_rc" != "0" ]; then echo "::warning::#$iteration news step exit $news_rc"; fi
              if printf '%s\n' "$news" | grep -qx "news: refreshed"; then
                force=1
                force_slow=1
                echo "#$iteration news refreshed"
              fi
            fi
            if [ "$cf_failures" -eq 5 ]; then
              echo "::error::Cloudflare deploy failed 5 times in a row"
              red=1
            fi
            if [ "$failures" -eq 5 ]; then
              echo "::error::Restore, build or GitHub publish failed 5 times in a row"
              red=1
            fi
            if [ "$nothing" -ge 5 ]; then
              echo "::error::Nothing could be published 5 times in a row"
              exit 1
            fi
          done
          # Final flush: bring the legacy copy level with the last build so the next loop restores the newest state.
          if [ "$clean" = "1" ] && [ "$have_dist" = "1" ] && [ "$last_gh" -lt "$last_publish" ]; then
            { python tools/verify_sealed.py dist && push_pages "Publish final"; } || echo "::warning::Final GitHub push failed"
            rm -rf dist/.git
          fi
          [ "$red" = "0" ] || exit 1

      # Scheduled starts are delayed or skipped by GitHub, which left gaps of hours between loops. Queue the next loop
      # from inside this one: it waits in the concurrency group and starts the moment this run ends. A run that ended
      # early (under an hour) or failed does not chain, so a fault cannot turn into a restart storm; the cron backstop
      # and the failed-run notice stay as they were.
      - name: Continue
        if: success() && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ $(( $(date +%s) - RUN_STARTED )) -lt 3600 ]; then
            echo "Run lasted under an hour, not chaining another"
            exit 0
          fi
          gh workflow run gheymat-latest.yml --ref master
