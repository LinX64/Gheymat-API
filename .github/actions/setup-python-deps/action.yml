name: Python and dependencies
description: Python 3.12 with the pinned requirements (pip cache keyed on requirements.txt)
runs:
  using: composite
  steps:
    - name: Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements.txt
    - name: Install
      shell: bash
      run: pip install -q -r requirements.txt
